name: Build & Publish OctaOS Desktop Installers

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-installers:
    name: Build & Package Desktop Installers
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Install Frontend & Desktop Dependencies
        run: |
          cd frontend
          npm ci || npm install
          cd desktop
          npm ci || npm install

      - name: Compile Standalone Binaries & Packaging
        run: |
          bash scripts/build_desktop_app.sh

      - name: Create & Publish GitHub Release with Device Downloads
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: OctaOS Desktop Release ${{ github.ref_name }}
          body: |
            ## 💻 OctaOS Desktop Installers & Device Downloads

            Download the appropriate installer for your computer's operating system and processor below:

            ### 🍏 Apple macOS Downloads
            - **For Apple Silicon Macs (M1 / M2 / M3 / M4 Chips):**
              Download `OctaOS-Setup-macOS-arm64.dmg`
            - **For Intel-based Macs:**
              Download `OctaOS-Setup-macOS-x64.dmg`

            ### 🪟 Microsoft Windows Downloads
            - **For Windows 10 & Windows 11 (64-bit):**
              Download `OctaOS-Setup-Windows-x64.exe`

            ---
            ### ⚡ Features Included in this Release:
            - **Zero-Touch Auto-Configuration:** Automatically sets up SQLite FTS5 memory (`~/.octaos/memory.db`), `USER.md`, and background services on initial launch.
            - **BYO API Key Multi-LLM Routing:** Dynamic model orchestration across Gemini, Claude 3.7, OpenAI, Grok, and Kimi.
            - **Zero-Trust Command Sanitization:** Pre-execution security guardrails to protect system files.
          files: |
            dist/*.dmg
            dist/*.exe
